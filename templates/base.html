<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Математичний довідник{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_with_timestamp if url_with_timestamp else url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container nav-container">
            <a href="/" class="logo"><i class="fa-solid fa-calculator"></i> MathCore</a>
            <nav class="navbar" id="navbar">
                <a href="/"><i class="fa-solid fa-house"></i> Головна</a>
                <a href="/formulas"><i class="fa-solid fa-book"></i> Усі формули</a>
            </nav>
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </header>

    <main class="main-content container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Математичний довідник. Сучасні інтерактивні формули.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
