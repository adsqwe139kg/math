{% extends "base.html" %}

{% block content %}
<div class="container">
    <div style="text-align: center; margin: 40px 0;">
        <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Математичний довідник</h1>
    </div>

    <div class="topics-grid">
        {% for topic_id, topic_data in topics.items() %}
            <div class="topic-card">
                <span class="favorite-star" onclick="this.classList.toggle('active')">★</span>
                <div>
                    <h3>{{ topic_data.title }}</h3>
                    <p style="color: #94a3b8;">{{ topic_data.desc or 'Детальна інформація про тему.' }}</p>
                </div>
                <a href="/topic/{{ topic_id }}" class="btn-main">Перейти</a>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
