{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 1200px; margin: 0 auto; padding: 20px;">
    
    <div style="text-align: center; margin: 40px 0;">
        <h1 style="color: #fff;">Інтерактивний математичний довідник</h1>
        <p style="color: #94a3b8;">Теорія, формули, візуалізація та калькулятори.</p>
    </div>

    <div class="topics-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px;">
        {% for topic_id, topic_data in topics.items() %}
            <div class="topic-card" style="background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155;">
                <h3 style="color: #fff; margin-bottom: 10px;">{{ topic_data.title }}</h3>
                <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">
                    {{ topic_data.desc or 'Натисніть для вивчення теми.' }}
                </p>
                <a href="/topic/{{ topic_id }}" class="btn-main" style="display: block; background: #38bdf8; color: #000; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold;">Перейти</a>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
