{% extends "base.html" %}

{% block content %}
<div class="container">
    <div style="text-align: center; margin: 40px 0;">
        <h1 style="font-size: 2.5rem; color: #fff; margin-bottom: 15px; font-weight: 700;">Інтерактивний математичний довідник</h1>
        <p style="color: #94a3b8; font-size: 1.1rem;">Теорія, формули та приклади розв'язання.</p>
    </div>

    <div class="card-grid">
        {% for topic_id, topic_data in topics.items() %}
            <div class="card">
                <span class="favorite-star" onclick="toggleFavorite(this)">★</span>
                <div>
                    <h3 style="font-size: 1.3rem; color: #fff; margin-bottom: 12px;">{{ topic_data.title }}</h3>
                    <p style="color: #94a3b8; font-size: 0.95rem; line-height: 1.5;">
                        {{ topic_data.desc or 'Натисніть для вивчення теми.' }}
                    </p>
                </div>
                <a href="/topic/{{ topic_id }}" class="btn">Перейти</a>
            </div>
        {% endfor %}
    </div>
</div>

<script>
    function toggleFavorite(element) {
        element.classList.toggle('active');
    }
</script>
{% endblock %}
