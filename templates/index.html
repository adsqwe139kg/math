{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2 style="margin-bottom: 20px; font-weight: 700; letter-spacing: -0.5px;">📐 Математичні теми</h2>
    
    <div class="topics-grid">
        {% for topic_id, topic_data in topics.items() %}
            <a href="/topic/{{ topic_id }}" class="topic-card">
                <div>
                    <h3>{{ topic_data.title }}</h3>
                    <p>Натисніть, щоб відкрити формули, детальні правила та приклади розв'язання.</p>
                </div>
                <span class="btn-back" style="margin-top: 15px; text-align: right; display: block;">Читати далі ➔</span>
            </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
